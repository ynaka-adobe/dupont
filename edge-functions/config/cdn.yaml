kind: 'CDN'
version: '1'
data:
  originSelectors:
    rules:
      - name: route-persona-edge-test
        when: { reqProperty: path, equals: "/persona-edge-test" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
      - name: route-persona-home
        when: { reqProperty: path, equals: "/" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
      - name: route-persona-water
        when: { reqProperty: path, equals: "/water" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
      - name: route-persona-automotive
        when: { reqProperty: path, equals: "/industries/automotive" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
      - name: route-persona-healthcare
        when: { reqProperty: path, equals: "/industries/healthcare-and-medical" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
      - name: route-persona-about
        when: { reqProperty: path, equals: "/about" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
